<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Movie Lists</title>
</head>
<body>
    <header style="position: sticky; top: 0; background-color: #f1f1f1; padding: 30px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <button onclick="window.location.href='../index.html'" style="display: inline-block;">Back to Home</button>
            <h1 style="right: 50%; position: absolute; margin:0 auto; align-self: center; transform: translateX(50%)">Movie Lists</h1>
        </div>
    </header>

    <form id="addMovieForm" class="form-container">
        <h2 style="margin: 0 auto">Add Movie</h2>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>

        <label for="year">Year:</label>
        <input type="number" id="year" name="year" required>

        <label for="genre">Genre:</label>
        <select id="genre" name="genre" required>
            <option value="">Select Genre</option>
            <option value="action">Action</option>
            <option value="comedy">Comedy</option>
            <option value="drama">Drama</option>
            <option value="horror">Horror</option>
            <option value="sci-fi">Sci-Fi</option>
        </select>

        <label for="rating">Select Rating:</label>
        <div id="starSelector" style="display: flex; gap: 20px;">
            <button type="button" class="star" data-value="1">&#9733;</button>
            <button type="button" class="star" data-value="2">&#9733;</button>
            <button type="button" class="star" data-value="3">&#9733;</button>
            <button type="button" class="star" data-value="4">&#9733;</button>
            <button type="button" class="star" data-value="5">&#9733;</button>
        </div>

        <button type="submit">Add Movie</button>
    </form>

    <br>

    <section id="movieList" class="form-container">
        <h2 style="margin: 0 auto">Movie List</h2>
        <div id="moviesContainer"></div>
    </section>

    <footer style="text-align: center; align-self:baseline; width: 100%; bottom: 0; padding: 20px; background-color: #f1f1f1;">
        <p>&copy; 2026 Daniel Asis.</p>
        <h2>Contact Information</h2>
        <p>Email: <a href="mailto:b2029djfasis@pshs.edu.ph">b2029djfasis@pshs.edu.ph</a></p>
    </footer>
</body>

<script>
    // Star rating functionality

    // Select all star buttons and initialize selected rating
    const starButtons = document.querySelectorAll('.star');
    const titleInput = document.getElementById('title');
    const yearInput = document.getElementById('year');

    let selectedRating = 0;

    starButtons.forEach(button => {
        button.addEventListener('click', () => {
            selectedRating = parseInt(button.getAttribute('data-value'));
            updateStarDisplay();
            updateSubmitDisplay();
        });
    });

    titleInput.addEventListener('input', updateSubmitDisplay);
    yearInput.addEventListener('input', updateSubmitDisplay);

    // Function to update the star display based on the selected rating
    function updateStarDisplay() {
        starButtons.forEach(button => {
            const value = parseInt(button.getAttribute('data-value'));
            if (value <= selectedRating) {
                button.classList.add('selected-rating');
            } else {
                button.classList.remove('selected-rating');
            }
        });
    }

    function updateSubmitDisplay() {
        const submitButton = document.querySelector('button[type="submit"]');
        const titleInput = document.getElementById('title');
        const yearInput = document.getElementById('year');

        const movies = JSON.parse(localStorage.getItem('movies')) || [];

        let movieExists = movies.some(m => m.title === titleInput.value && m.year === yearInput.value);

        if (!movieExists) {
            submitButton.textContent = `Add Movie (Rating: ${selectedRating} stars)`;
        } else {
            submitButton.textContent = `Update Movie (Rating: ${selectedRating} stars)`;
        }
    }

    // Form submission handling
    const addMovieForm = document.getElementById('addMovieForm');
    addMovieForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value;
        const year = document.getElementById('year').value;
        const genre = document.getElementById('genre').value;

        console.log(`Title: ${title}, Year: ${year}, Genre: ${genre}, Rating: ${selectedRating}`);
        
        const KEY = 'movies';
        const newMovie = { title, year, genre, totalRating: selectedRating, ratingCount: 1 };
        let movies = JSON.parse(localStorage.getItem(KEY)) || [];

        let movieExists = movies.some(m => m.title === title && m.year === year);

        if (movieExists) {
            movies = movies.map(m => {
                if (m.title === title && m.year === year) {
                    return {title, year, genre, totalRating: m.totalRating + selectedRating, ratingCount: m.ratingCount + 1}; // Update existing movie
                }
                return m;
            });

            localStorage.setItem(KEY, JSON.stringify(movies));
        } else {
            movies.push(newMovie);
            localStorage.setItem(KEY, JSON.stringify(movies));
        }

            // Clear form fields and reset star rating after submission
            addMovieForm.reset();
            selectedRating = 0;
            updateStarDisplay();

            // After adding a new movie, call the displayMovies function to update the movie list displayed on the page.
            displayMovies();
    });

    // Function to display movies from localStorage
    // This function retrieves the movies from localStorage, creates elements for each movie, and appends them to the movies container.

    function displayMovies() {
        const moviesContainer = document.getElementById('moviesContainer');
        moviesContainer.innerHTML = '';
        const movies = JSON.parse(localStorage.getItem('movies')) || [];

        if(movies.length === 0) {
            moviesContainer.textContent = 'No movies added yet.';
            return;
        }

        movies.forEach(movie => {
            // create new div element for each movie and set its text content to display the movie's title, year, genre, and rating. The rating is displayed as stars (★) based on the rating value.
            const movieElement = document.createElement('div');
            movieElement.textContent = `Title: ${movie.title}, (${movie.year}) -\nGenre: ${movie.genre}, Rating: ${Math.round(100*(movie.totalRating / movie.ratingCount))/100} ★\n`;
            movieElement.classList.add('movie-item');
            movieElement.style.whiteSpace = 'pre-line';

            // Delete button
            const deleteButton = document.createElement('button');
            deleteButton.textContent = 'Delete';
            deleteButton.dataset.title = movie.title; // Store the title in a data attribute for identification

            deleteButton.addEventListener('click', () => {
                confirm('Are you sure you want to delete this movie?') && (() => {
                    let movies = JSON.parse(localStorage.getItem('movies')) || [];
                    movies = movies.filter(m => m.title !== deleteButton.dataset.title); // Set "movies" to the filtered array that excludes the movie with the matching title
                    localStorage.setItem('movies', JSON.stringify(movies));
                    displayMovies();
                })();
            });

            movieElement.appendChild(deleteButton);
            moviesContainer.appendChild(movieElement);
        });
    }

    // Display movies on page load, in addition to after adding a new movie, to ensure the list is always up to date.
    displayMovies();
</script>
</html>
