<!DOCTYPE html>
<html>
<head>
  <meta name="author" content="<your names>" />
  <meta name="revised" content="<date today>" />
  <style>
    body { font-family: Arial, sans-serif; }
    .header, .footer {
      background: lightblue;
      padding: 10px;
    }
    .footer {
       opacity: 0.5;

       position: fixed;
       bottom: 0;
       width: 100%;
    }
    .sidebar {
      background: lightgreen;
      width: 150px;
      height: 200px;

      position: relative;
      top: 20px;
      left: 20px;
    }
    .content {
      background: lightyellow;
      width: 300px;
      height: 200px;

      position: absolute;
      top: 66px;
      left: 200px;

      z-index: 1;
    }    
    .notice {
        position: absolute;
        /* top: 60px;
        left: 400px; */
        background: orange;
        /* padding: 10px; */
        z-index: 2;

        /* Challenge: Place notice on the top right corner of the content box */
        width: 100px; /* Changed width to make it more predictable to work with */
        top: 66px; /* Same top as content to align it with the top of the content box */
        left: 400px; /* Positioned to the right of the content box (200px left + 300px width) */
        padding-top: 10px; /* Changed padding to make it more predictable to work with */
        padding-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="header">Header</div>
  <div class="sidebar">Sidebar</div>
  <div class="content">Main Content</div>
  <div class="footer">Footer</div>
  <div class="notice">Notice!</div>
</body>
</html>
